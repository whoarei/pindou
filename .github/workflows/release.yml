name: Build releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build release APK
        run: flutter build apk --release
      - name: Name Android package
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/PindouStudio-${GITHUB_REF_NAME}-android.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PindouStudio-android
          path: build/app/outputs/flutter-apk/PindouStudio-*-android.apk
          if-no-files-found: error

  windows:
    name: Build Windows portable package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          $archiveName = "PindouStudio-$env:GITHUB_REF_NAME-windows-x64.zip"
          $archive = Join-Path $env:GITHUB_WORKSPACE "build/windows/$archiveName"
          if (-not (Test-Path -LiteralPath $releaseDir)) {
            throw "Windows release directory was not found: $releaseDir"
          }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $archive -Force
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: PindouStudio-windows-x64
          path: build/windows/PindouStudio-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/PindouStudio-*-android.apk
            release-assets/PindouStudio-*-windows-x64.zip
          generate_release_notes: true
          name: 拼豆工坊 ${{ github.ref_name }}
